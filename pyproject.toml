[project]
name = "e_desk"
authors = [
    { name = "Anther Technologies Pvt Ltd", email = "anther.tech" }
]
description = "E Desk"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
